[project]
name = "serving-model"
version = "0.1.0"
description = "Serving a self trained toy ml model ( low accuracy ) through fastapi"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[project.scripts]
serving-model = "serving_model:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
